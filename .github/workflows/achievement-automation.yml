name: Continuous Achievement Automation

on:
  schedule:
    # Runs every 6 hours automatically to progress to Pull Shark Gold (1,024 PRs)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of PRs to create and merge in this batch'
        required: true
        default: '50'

permissions:
  contents: write
  pull-requests: write

jobs:
  progress-achievements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Fast Milestone Batch
        env:
          GITHUB_TOKEN: ${{ secrets.USER_PAT || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.USER_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BATCH_SIZE=${{ github.event.inputs.batch_size || 50 }}
          python3 -c "
          import subprocess, json, sys
          res = subprocess.check_output('gh pr list --repo zisam-glitch/achievements-nexus --state all --limit 2000 --json number', shell=True)
          curr = len(json.loads(res.decode()))
          start = curr + 1
          target = min(1024, curr + int('$BATCH_SIZE'))
          print(f'Starting batch from {start} to {target} (Target max: 1024)')
          if start <= 1024:
              subprocess.run(f'python3 scripts/fast_runner.py {target} {start}', shell=True, check=True)
          else:
              print('Pull Shark Gold target of 1024 PRs has been reached!')
          "
